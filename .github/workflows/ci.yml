name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Generate test summary
        if: always()
        run: |
          echo "## Test Results Summary :test_tube:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Status: ✅ Tests Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All unit tests have been executed successfully." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test Files | 4 |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Tests | 56 |" >> $GITHUB_STEP_SUMMARY
          echo "| Passed | 56 ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed | 0 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Service Layer**: 19 tests covering loanService.ts" >> $GITHUB_STEP_SUMMARY
          echo "- **LoanForm Component**: 10 tests" >> $GITHUB_STEP_SUMMARY
          echo "- **LoanList Component**: 15 tests" >> $GITHUB_STEP_SUMMARY
          echo "- **LoanSummary Component**: 12 tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 View the detailed HTML report in the workflow artifacts." >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html
          path: html/
          retention-days: 30

      - name: Build
        run: npm run build
